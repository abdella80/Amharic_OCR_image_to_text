<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amharic OCR System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>

<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-gray-800 text-white min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="w-full border-b border-gray-800 bg-gray-950/70 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between">

            <!-- Logo / Title -->
            <div>
                <h1 class="text-2xl font-bold text-cyan-400">
                    አማርኛ OCR System
                </h1>
                <p class="text-sm text-gray-400">
                    AI Powered Amharic & English Text Extraction
                </p>
            </div>

            <!-- Manual Navigation -->
            <nav class="mt-4 md:mt-0 flex gap-6 text-gray-300 text-sm font-medium">
                <a href="#" class="hover:text-cyan-400 transition">Home</a>
                <a href="#" class="hover:text-cyan-400 transition">Manual</a>
                <a href="#" class="hover:text-cyan-400 transition">About</a>
                <a href="#" class="hover:text-cyan-400 transition">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-6">

        <div class="w-full max-w-3xl bg-gray-900/70 backdrop-blur-xl border border-gray-700 rounded-2xl shadow-2xl p-8">

            <!-- Heading -->
            <h2 class="text-3xl font-bold text-center mb-2 text-cyan-400">
                Upload Image for OCR
            </h2>

            <p class="text-center text-gray-400 mb-6">
                Upload image → Extract Amharic & English text
            </p>

            <!-- Form -->
            <form method="POST" enctype="multipart/form-data" class="space-y-5">
                {% csrf_token %}

                <div class="border-2 border-dashed border-gray-600 rounded-xl p-6 text-center hover:border-cyan-400 transition">

                    <input 
                        type="file" 
                        name="image" 
                        class="w-full text-gray-300 
                               file:mr-4 file:py-2 file:px-4 
                               file:rounded-lg file:border-0 
                               file:bg-cyan-500 file:text-white 
                               hover:file:bg-cyan-600 cursor-pointer"
                    >

                    <p class="mt-3 text-sm text-gray-500">
                        Supported: JPG, PNG, JPEG
                    </p>
                </div>

                <!-- Button -->
                <button type="submit"
                    class="w-full py-3 bg-cyan-500 hover:bg-cyan-600 
                           text-white font-semibold rounded-xl shadow-lg transition duration-300">
                    🚀 Extract Text
                </button>
            </form>

            <!-- Result -->
            <div class="mt-8">
                <h2 class="text-lg font-semibold mb-2 text-gray-300">
                    Result:
                </h2>

                <textarea
                    rows="12"
                    class="w-full bg-gray-950 border border-gray-700 rounded-xl p-4 text-gray-200 
                           focus:outline-none focus:ring-2 focus:ring-cyan-500"
                    placeholder="Extracted text will appear here..."
                >{{ text }}</textarea>
                <div class="flex justify-end gap-4 mt-2">
                    <button 
                        type="button" 
                        class="py-2 px-4 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl shadow-lg transition duration-300"
                        onclick="document.getElementById('result-textarea').value = ''"
                    >
                        Delete
                    </button>
                    <button 
                        type="button" 
                        class="py-2 px-4 bg-cyan-500 hover:bg-cyan-600 text-white font-semibold rounded-xl shadow-lg transition duration-300"
                        onclick="document.getElementById('result-textarea').select(); document.execCommand('copy');"
                    >
                        Copy
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 bg-gray-950/70 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 text-center text-gray-400 text-sm">

            <p>
                © 2026 Amharic OCR System. All Rights Reserved.
            </p>

            <p class="mt-1 text-cyan-400 font-medium">
                Developed by Abdella Dawud
            </p>

        </div>
    </footer>

    <!-- Dark Mode -->
    <script>
        document.documentElement.classList.add('dark');
    </script>

</body>
</html>
